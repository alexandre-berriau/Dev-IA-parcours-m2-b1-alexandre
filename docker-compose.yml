services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5434:5432"   # 5434 sur le poste : 5432 et 5433 sont déjà pris par d'autres conteneurs
    volumes:
      # Scripts exécutés automatiquement au PREMIER démarrage (base vide) : schéma puis chargement
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Les données de la base persistent entre deux `docker compose down` / `up`
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
